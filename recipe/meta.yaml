{% set version = "0.4.1" %}

package:
  name: reaktoro-pse
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/reaktoro-pse/reaktoro_pse-{{ version }}.tar.gz
  sha256: 73683979738c108108b56ce607d04a80f54af59ef9764338608283f53ace73fb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=7
    - pip
  run:
    - python >={{ python_min }}
    - pyomo
    - watertap-solvers >=24.12.9

test:
  imports:
    - reaktoro_pse
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/watertap-org/reaktoro-pse
  license_family: BSD
  license: BSD-3-Clause
  license_file:
    - LICENSE.md
    - COPYRIGHT.md
  summary: "Reaktoro-PSE is a package for configuring Reaktoro as a gray box model in Pyomo, IDAES-PSE, and WaterTAP modeling libraries. "
  dev_url: "https://github.com/watertap-org/reaktoro-pse"

extra:
  recipe-maintainers:
    - sufikaur
    - lbianchi-lbl
    - ksbeattie
